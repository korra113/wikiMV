name: Generate Keystore Once

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key and Save to File
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias sylar113 -storepass tabun112 -keypass tabun112 \
            -dname "CN=WikiMV, OU=Apps, O=Personal, L=City, S=State, C=RU"

          # Кодируем в base64 без переносов прямо в файл
          base64 -w 0 release.jks > keystore_base64.txt

      - name: Upload base64 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secret-file
          path: keystore_base64.txt
