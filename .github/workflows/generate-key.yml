name: Generate Keystore Once

on:
  workflow_dispatch: # Запуск вручную кнопкой

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key and Output Base64
        run: |
          # Генерируем ключ (замените пароли MySecretPass123 на свои!)
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-alias -storepass MySecretPass123 -keypass MySecretPass123 \
            -dname "CN=WikiMV, OU=Apps, O=Personal, L=City, S=State, C=RU"

          echo "================ КЛЮЧ В BASE64 (СКОПИРУЙТЕ ВСЁ НИЖЕ) ================"
          base64 -w 0 release.jks
          echo ""
          echo "====================================================================="
