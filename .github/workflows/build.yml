name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 1. Раскладываем веб-ассеты по правильным папкам
      - name: Prepare Web Assets
        run: |
          rm -rf www
          mkdir -p www/css www/js
          cp index.html manifest.json sw.js icon-*.png www/ 2>/dev/null || true
          [ -d images ] && cp -r images www/ 2>/dev/null || true
          [ -d fonts ] && cp -r fonts www/ 2>/dev/null || true
          [ -d data ] && cp -r data www/ 2>/dev/null || true

          [ -d css ] && cp -r css/* www/css/ 2>/dev/null || true
          [ -d js ] && cp -r js/* www/js/ 2>/dev/null || true

          cp *.css www/css/ 2>/dev/null || true
          cp *.js www/js/ 2>/dev/null || true
          rm -f www/js/sw.js
          cp sw.js www/sw.js 2>/dev/null || true

      # 2. Инициализация Capacitor и Android проекта
      - name: Setup Project and Capacitor
        run: |
          echo '{"name": "wikimapia-app", "version": "1.2.0"}' > package.json
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app@^7 @capacitor/assets@^3

          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/icon.png

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wikimapia.viewer",
            "appName": "WikiMV",
            "webDir": "www",
            "backgroundColor": "#111827",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#111827"

          # Прописываем версию 1.2.0 и versionCode 120
          python3 - << 'EOF'
          import re

          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'versionCode\s*=?\s*1\b', 'versionCode 120', content, count=1)
          content = re.sub(r'versionName\s*=?\s*"1\.0"', 'versionName "1.2.0"', content, count=1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Настройка AndroidManifest.xml: разрешения, largeHeap + регистрация Foreground Service
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if 'android:largeHeap' not in content and '<application' in content:
              content = content.replace('<application', '<application\n        android:largeHeap="true"', 1)

          # 1. Разрешения перед </manifest>
          permissions = """    <!-- Сеть и геолокация -->
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <!-- Фоновая служба геолокации и уведомления (Android 9 - 15+) -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Отключение Doze Mode -->
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <!-- Шагомер и сенсоры высокой частоты -->
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />

              <!-- Удержание процессора (WakeLock) и вибрация -->
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <!-- Датчики -->
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.stepcounter" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.stepdetector" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.barometer" android:required="false" />
          </manifest>"""

          if "ACCESS_FINE_LOCATION" not in content and "</manifest>" in content:
              content = content.replace("</manifest>", permissions)

          # 2. Регистрация службы внутри <application>
          service_def = """        <service
                  android:name="com.wikimapia.viewer.TrackingForegroundService"
                  android:foregroundServiceType="location"
                  android:exported="false" />
          </application>"""

          if "TrackingForegroundService" not in content and "</application>" in content:
              content = content.replace("</application>", service_def)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Создаем отдельный класс фоновой службы TrackingForegroundService.java
          cat << 'EOF' > android/app/src/main/java/com/wikimapia/viewer/TrackingForegroundService.java
          package com.wikimapia.viewer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class TrackingForegroundService extends Service {
              private static final String CHANNEL_ID = "wikimv_tracking_channel";
              private static final int NOTIFICATION_ID = 2001;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int pendingFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      pendingFlags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, openIntent, pendingFlags);

                  int iconRes = getApplicationInfo().icon != 0
                          ? getApplicationInfo().icon
                          : android.R.drawable.ic_menu_mylocation;

                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("WikiMV")
                          .setContentText("Фоновая запись GPS-трека и шагомера активна")
                          .setSmallIcon(iconRes)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .setSilent(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                      } else {
                          startForeground(NOTIFICATION_ID, notification);
                      }
                  } catch (SecurityException e) {
                      try {
                          startForeground(NOTIFICATION_ID, notification);
                      } catch (Exception ignored) {
                          stopSelf();
                      }
                  }

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      stopForeground(STOP_FOREGROUND_REMOVE);
                  } else {
                      stopForeground(true);
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Запись GPS-трека",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Уведомление о фоновой записи трека и навигации PDR");
                      channel.setShowBadge(false);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

          # Создаем MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/wikimapia/viewer/MainActivity.java
          package com.wikimapia.viewer;

          import android.os.Bundle;
          import android.os.Build;
          import android.os.LocaleList;
          import android.content.res.Configuration;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.webkit.ServiceWorkerWebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.content.Intent;
          import android.net.Uri;
          import android.app.NotificationManager;
          import android.content.pm.PackageManager;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.content.Context;

          public class MainActivity extends BridgeActivity {
              private static final int PERM_REQUEST_CODE = 1001;
              private static final int PERM_ACTIVITY_CODE = 1002;
              private static final int PERM_NOTIF_CODE = 1003;
              private PowerManager.WakeLock wakeLock;
              private long lastPermRequestTime = 0L;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  Locale ruLocale = new Locale("ru", "RU");
                  Locale.setDefault(ruLocale);
                  Configuration config = getResources().getConfiguration();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      config.setLocales(new LocaleList(ruLocale, new Locale("ru")));
                  } else {
                      config.locale = ruLocale;
                  }
                  getResources().updateConfiguration(config, getResources().getDisplayMetrics());

                  super.onCreate(savedInstanceState);

                  if (bridge != null && bridge.getWebView() != null) {
                      WebSettings webSettings = bridge.getWebView().getSettings();
                      webSettings.setDomStorageEnabled(true);
                      webSettings.setDatabaseEnabled(true);
                      webSettings.setMediaPlaybackRequiresUserGesture(false);
                      webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }

                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(bridge.getWebView(), true);

                      bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public boolean isIgnoringBatteryOptimizations() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                                  return pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                              }
                              return true;
                          }

                          @JavascriptInterface
                          public void requestIgnoreBatteryOptimizations() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  try {
                                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                          intent.setData(Uri.parse("package:" + getPackageName()));
                                          startActivity(intent);
                                      }
                                  } catch (Exception e) {
                                      openAppSettingsInternal();
                                  }
                              }
                          }

                          @JavascriptInterface
                          public void openAppSettings() {
                              openAppSettingsInternal();
                          }

                          // --- РАЗРЕШЕНИЕ НА ШАГОМЕР (ACTIVITY_RECOGNITION) ---
                          @JavascriptInterface
                          public boolean hasActivityRecognitionPermission() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  return checkSelfPermission(android.Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED;
                              }
                              return true;
                          }

                          @JavascriptInterface
                          public void requestActivityRecognitionPermission() {
                              runOnUiThread(() -> {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      if (checkSelfPermission(android.Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED) {
                                          lastPermRequestTime = System.currentTimeMillis();
                                          requestPermissions(new String[]{android.Manifest.permission.ACTIVITY_RECOGNITION}, PERM_ACTIVITY_CODE);
                                          return;
                                      }
                                  }
                                  notifyPermissionsChangedToJs();
                              });
                          }

                          // --- РАЗРЕШЕНИЕ НА УВЕДОМЛЕНИЯ (POST_NOTIFICATIONS) ---
                          @JavascriptInterface
                          public boolean hasNotificationPermission() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                      return false;
                                  }
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                                  if (nm != null && !nm.areNotificationsEnabled()) {
                                      return false;
                                  }
                              }
                              return true;
                          }

                          @JavascriptInterface
                          public void requestNotificationPermission() {
                              runOnUiThread(() -> {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                          lastPermRequestTime = System.currentTimeMillis();
                                          requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, PERM_NOTIF_CODE);
                                          return;
                                      }
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                                      if (nm != null && !nm.areNotificationsEnabled()) {
                                          openAppSettingsInternal();
                                          return;
                                      }
                                  }
                                  notifyPermissionsChangedToJs();
                              });
                          }

                          // Включение/выключение Foreground Service и удержания процессора
                          @JavascriptInterface
                          public void setBackgroundTrackingState(boolean isTracking) {
                              runOnUiThread(() -> {
                                  try {
                                      Intent serviceIntent = new Intent(MainActivity.this, TrackingForegroundService.class);
                                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);

                                      if (isTracking) {
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                              startForegroundService(serviceIntent);
                                          } else {
                                              startService(serviceIntent);
                                          }
                                          if (pm != null && (wakeLock == null || !wakeLock.isHeld())) {
                                              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "WikiMV:TrackRecordingLock");
                                              wakeLock.acquire(12 * 60 * 60 * 1000L);
                                          }
                                      } else {
                                          stopService(serviceIntent);
                                          if (wakeLock != null && wakeLock.isHeld()) {
                                              wakeLock.release();
                                          }
                                      }
                                  } catch (Exception ignored) {}
                              });
                          }

                          @JavascriptInterface
                          public void setKeepScreenOn(boolean keepOn) {
                              runOnUiThread(() -> {
                                  if (keepOn) {
                                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  } else {
                                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  }
                              });
                          }
                      }, "AndroidBridge");
                  }

                  // При старте запрашиваем ТОЛЬКО геолокацию
                  requestLocationPermissionOnStart();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      try {
                          ServiceWorkerController swController = ServiceWorkerController.getInstance();
                          ServiceWorkerWebSettings swSettings = swController.getServiceWorkerWebSettings();
                          swSettings.setAllowContentAccess(true);
                          swSettings.setAllowFileAccess(true);
                          swSettings.setBlockNetworkLoads(false);
                          swSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                          swController.setServiceWorkerClient(new ServiceWorkerClient() {
                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {
                                  if (bridge != null && bridge.getLocalServer() != null) {
                                      return bridge.getLocalServer().shouldInterceptRequest(request);
                                  }
                                  return null;
                              }
                          });
                      } catch (Exception ignored) {}
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "window.handleGlobalBackAction ? window.handleGlobalBackAction() : false;",
                                  value -> {
                                      if (!"true".equals(value)) {
                                          setEnabled(false);
                                          getOnBackPressedDispatcher().onBackPressed();
                                          setEnabled(true);
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW);
                              intent.setData(Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void requestLocationPermissionOnStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      List<String> perms = new ArrayList<>();
                      if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(android.Manifest.permission.ACCESS_FINE_LOCATION);
                          perms.add(android.Manifest.permission.ACCESS_COARSE_LOCATION);
                      }
                      if (!perms.isEmpty()) {
                          requestPermissions(perms.toArray(new String[0]), PERM_REQUEST_CODE);
                      }
                  }
              }

              private void openAppSettingsInternal() {
                  try {
                      Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      intent.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  } catch (Exception ignored) {}
              }

              private void notifyPermissionsChangedToJs() {
                  if (bridge != null && bridge.getWebView() != null) {
                      bridge.getWebView().post(() -> bridge.getWebView().evaluateJavascript(
                          "window.dispatchEvent(new Event('wm:android-permissions-updated'));",
                          null
                      ));
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if ((requestCode == PERM_ACTIVITY_CODE || requestCode == PERM_NOTIF_CODE) &&
                      grantResults != null && grantResults.length > 0 &&
                      grantResults[0] != PackageManager.PERMISSION_GRANTED) {
                      long elapsed = System.currentTimeMillis() - lastPermRequestTime;
                      String perm = (permissions != null && permissions.length > 0) ? permissions[0] : null;
                      // Если система отклонила мгновенно без диалога («Больше не спрашивать») — открываем настройки приложения
                      if (elapsed < 300 && perm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !shouldShowRequestPermissionRationale(perm)) {
                          openAppSettingsInternal();
                      }
                  }
                  notifyPermissionsChangedToJs();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  notifyPermissionsChangedToJs();
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # Цвета статусбара
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:fitsSystemWindows">true</item>\n        <item name="android:statusBarColor">#111827</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:navigationBarColor">#111827</item>' android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBarLaunch"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:statusBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android

      # 3. Извлекаем постоянный ключ из GitHub Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # 4. Сборка Release APK и подпись постоянным ключом
      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # Выравнивание APK (zipalign)
          $BUILD_TOOLS/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/aligned.apk

          # Подпись постоянным ключом с помощью apksigner
          $BUILD_TOOLS/apksigner sign --ks ../release.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out app/build/outputs/apk/release/wikiMV_1.2.0.apk \
            app/build/outputs/apk/release/aligned.apk

      # 5. Проверка манифеста и версии прямо в логах GitHub
      - name: Check Manifest Info
        run: |
          cd android
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/aapt dump badging app/build/outputs/apk/release/wikiMV_1.2.0.apk | grep -E "package: name|sdkVersion"

      # 6. Выгрузка готового APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikiMV_1.2.0
          path: android/app/build/outputs/apk/release/wikiMV_1.2.0.apk
