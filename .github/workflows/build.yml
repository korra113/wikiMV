name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 1. Раскладываем веб-ассеты по правильным папкам
      - name: Prepare Web Assets
        run: |
          mkdir -p www/css www/js
          cp index.html manifest.json sw.js icon-*.png www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          [ -d css ] && cp -r css/* www/css/ 2>/dev/null || true
          [ -d js ] && cp -r js/* www/js/ 2>/dev/null || true

          cp *.css www/css/ 2>/dev/null || true
          cp *.js www/js/ 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true

      # 2. Инициализация Capacitor и сборка
      - name: Setup Project and Capacitor
        run: |
          echo '{"name": "wikimapia-app", "version": "1.0.6"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/app

          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/icon.png

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wikimapia.viewer",
            "appName": "WikiMV",
            "webDir": "www",
            "backgroundColor": "#111827",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#111827"

          # Прописываем версию 1.0.6 и versionCode 6 в build.gradle
          python3 - << 'EOF'
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content = content.replace('versionCode 1', 'versionCode 6')
          content = content.replace('versionName "1.0"', 'versionName "1.0.6"')

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Разрешения GPS в AndroidManifest.xml
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" />
          </manifest>"""

          if "ACCESS_FINE_LOCATION" not in content and "</manifest>" in content:
              content = content.replace("</manifest>", permissions)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Настройка MainActivity.java (кнопка "Назад" и перехват скачивания)
          python3 - << 'EOF'
          path = "android/app/src/main/java/com/wikimapia/viewer/MainActivity.java"
          code = """package com.wikimapia.viewer;

          import android.os.Bundle;
          import android.os.Build;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Включаем поддержку Service Worker в Android WebView для кэша тайлов
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      try {
                          ServiceWorkerController swController = ServiceWorkerController.getInstance();
                          swController.setServiceWorkerClient(new ServiceWorkerClient() {
                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {
                                  return null; // Разрешаем SW кэшировать тайлы карт
                              }
                          });
                      } catch (Exception ignored) {}
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "window.handleGlobalBackAction ? window.handleGlobalBackAction() : false;",
                                  value -> {
                                      if (!"true".equals(value)) {
                                          setEnabled(false);
                                          getOnBackPressedDispatcher().onBackPressed();
                                          setEnabled(true);
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });

                  this.bridge.getWebView().setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW);
                          intent.setData(Uri.parse(url));
                          startActivity(intent);
                      } catch (Exception ignored) {}
                  });
              }
          }
          """
          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          EOF

          # Цвета статусбара
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:fitsSystemWindows">true</item>\n        <item name="android:statusBarColor">#111827</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:navigationBarColor">#111827</item>' android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBarLaunch"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:statusBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android

      # 3. Компиляция стабильного Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/wikiMV_1.0.6.apk

      # 4. Проверка манифеста прямо в логах GitHub
      - name: Check Manifest Info
        run: |
          cd android
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/aapt dump badging app/build/outputs/apk/debug/wikiMV_1.0.6.apk | grep -E "package: name|sdkVersion"

      # 5. Выгрузка готового APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikiMV_1.0.6
          path: android/app/build/outputs/apk/debug/wikiMV_1.0.6.apk
