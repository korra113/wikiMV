name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          for item in *; do
            if [ "$item" != "www" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Setup Project and Capacitor
        run: |
          # Создаем package.json напрямую, чтобы избежать ошибки с заглавными буквами в wikiMV
          echo '{"name": "wikimapia-app", "version": "1.0.0"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Wikimapia Viewer" "com.wikimapia.viewer" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wikimapia-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
