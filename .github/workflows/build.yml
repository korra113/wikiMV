name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Подготовка веб-ассетов
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js icon-*.png css js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

      - name: Setup Project and Capacitor
        run: |
          echo '{"name": "wikimapia-app", "version": "1.0.0"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Wikimapia Viewer" "com.wikimapia.viewer" --web-dir www
          npx cap add android

          # 1. Разрешаем HTTP-трафик для растровых тайлов и API Wikimapia
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # 2. Добавляем права на геолокацию
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' android/app/src/main/AndroidManifest.xml

          # 3. Устраняем конфликт дублирующихся классов Kotlin (checkDebugDuplicateClasses)
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wikimapia-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
