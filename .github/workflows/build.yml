name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 1. Раскладываем веб-ассеты по правильным папкам
      - name: Prepare Web Assets
        run: |
          mkdir -p www/css www/js
          cp index.html manifest.json sw.js icon-*.png www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          # Если есть папки css и js в репозитории — копируем их
          [ -d css ] && cp -r css/* www/css/ 2>/dev/null || true
          [ -d js ] && cp -r js/* www/js/ 2>/dev/null || true

          # Если файлы лежат прямо в корне — переносим по местам
          cp *.css www/css/ 2>/dev/null || true
          cp *.js www/js/ 2>/dev/null || true

          # sw.js должен лежать строго в корне www
          cp sw.js www/sw.js 2>/dev/null || true

      # 2. Инициализация Capacitor и сборка ассетов
      - name: Setup Project and Capacitor
        run: |
          echo '{"name": "wikimapia-app", "version": "1.0.0"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          # Подготовка исходников для автоматического генератора иконок
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/icon.png

          # Конфигурация Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wikimapia.viewer",
            "appName": "WikiMV",
            "webDir": "www",
            "backgroundColor": "#111827",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          # Создаем проект Android
          npx cap add android

          # Генерируем все разрешения иконок (включая адаптивные круглые/квадратные)
          npx capacitor-assets generate --android --iconBackgroundColor "#111827"

          # Добавляем разрешения GPS без риска сломать XML манифеста
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" />
          </manifest>"""

          if "ACCESS_FINE_LOCATION" not in content and "</manifest>" in content:
              content = content.replace("</manifest>", permissions)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Настройка цветов статусбара в styles.xml (темная тема #111827)
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:fitsSystemWindows">true</item>\n        <item name="android:statusBarColor">#111827</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:navigationBarColor">#111827</item>' android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBarLaunch"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:statusBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          # Исключение конфликтующих зависимостей Kotlin
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          # Финальная синхронизация проекта
          npx cap sync android

      # 3. Компиляция APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 4. Выгрузка готового APK в артефакты
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikiMV
          path: android/app/build/outputs/apk/debug/app-debug.apk
