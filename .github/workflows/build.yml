name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 1. Раскладываем веб-ассеты по правильным папкам
      - name: Prepare Web Assets
        run: |
          mkdir -p www/css www/js
          cp index.html manifest.json sw.js icon-*.png www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          [ -d css ] && cp -r css/* www/css/ 2>/dev/null || true
          [ -d js ] && cp -r js/* www/js/ 2>/dev/null || true

          cp *.css www/css/ 2>/dev/null || true
          cp *.js www/js/ 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true

      # 2. Инициализация Capacitor и Android проекта
      - name: Setup Project and Capacitor
        run: |
          echo '{"name": "wikimapia-app", "version": "1.0.9"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/app

          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/icon.png

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wikimapia.viewer",
            "appName": "WikiMV",
            "webDir": "www",
            "backgroundColor": "#111827",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#111827"

          # Прописываем версию 1.0.9 и versionCode 90
          python3 - << 'EOF'
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content = content.replace('versionCode 1', 'versionCode 90')
          content = content.replace('versionName "1.0"', 'versionName "1.0.9"')

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Настройка AndroidManifest.xml: разрешения + регистрация Foreground Service
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Разрешения перед </manifest>
          permissions = """    <!-- Геолокация -->
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <!-- Фоновая служба геолокации и уведомления (Android 9 - 14+) -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Отключение Doze Mode -->
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <!-- Шагомер и сенсоры высокой частоты -->
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />

              <!-- Удержание процессора (WakeLock) и вибрация -->
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <!-- Датчики -->
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.stepcounter" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.stepdetector" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.barometer" android:required="false" />
          </manifest>"""

          if "ACCESS_FINE_LOCATION" not in content and "</manifest>" in content:
              content = content.replace("</manifest>", permissions)

          # 2. Регистрация службы внутри <application>
          service_def = """        <service
                  android:name="com.wikimapia.viewer.TrackingForegroundService"
                  android:foregroundServiceType="location"
                  android:exported="false" />
          </application>"""

          if "TrackingForegroundService" not in content and "</application>" in content:
              content = content.replace("</application>", service_def)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # Создаем отдельный класс фоновой службы TrackingForegroundService.java
          cat << 'EOF' > android/app/src/main/java/com/wikimapia/viewer/TrackingForegroundService.java
          package com.wikimapia.viewer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class TrackingForegroundService extends Service {
              private static final String CHANNEL_ID = "wikimv_tracking_channel";

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Запись GPS трека",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Фоновая запись GPS координат WikiMV");
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification.Builder builder = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);

                  Notification notification = builder
                          .setContentTitle("WikiMV: Идёт запись трека")
                          .setContentText("GPS активен в фоне при выключенном экране")
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .setOngoing(true)
                          .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  } else {
                      startForeground(101, notification);
                  }
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # Настройка MainActivity.java со всеми методами AndroidBridge
          cat << 'EOF' > android/app/src/main/java/com/wikimapia/viewer/MainActivity.java
          package com.wikimapia.viewer;

          import android.os.Bundle;
          import android.os.Build;
          import android.os.LocaleList;
          import android.content.res.Configuration;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.content.Context;

          public class MainActivity extends BridgeActivity {
              private static final int PERM_REQUEST_CODE = 1001;
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  Locale ruLocale = new Locale("ru", "RU");
                  Locale.setDefault(ruLocale);
                  Configuration config = getResources().getConfiguration();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      config.setLocales(new LocaleList(ruLocale, new Locale("ru")));
                  } else {
                      config.locale = ruLocale;
                  }
                  getResources().updateConfiguration(config, getResources().getDisplayMetrics());

                  super.onCreate(savedInstanceState);

                  if (bridge != null && bridge.getWebView() != null) {
                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(bridge.getWebView(), true);

                      bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public boolean isIgnoringBatteryOptimizations() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                                  return pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                              }
                              return true;
                          }

                          @JavascriptInterface
                          public void requestIgnoreBatteryOptimizations() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  try {
                                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                          intent.setData(Uri.parse("package:" + getPackageName()));
                                          startActivity(intent);
                                      }
                                  } catch (Exception e) {
                                      openAppSettings();
                                  }
                              }
                          }

                          @JavascriptInterface
                          public void openAppSettings() {
                              try {
                                  Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                                  intent.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                          }

                          // Включение/выключение Foreground Service и удержания процессора
                          @JavascriptInterface
                          public void setBackgroundTrackingState(boolean isTracking) {
                              runOnUiThread(() -> {
                                  try {
                                      Intent serviceIntent = new Intent(MainActivity.this, TrackingForegroundService.class);
                                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);

                                      if (isTracking) {
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                              startForegroundService(serviceIntent);
                                          } else {
                                              startService(serviceIntent);
                                          }
                                          if (pm != null && (wakeLock == null || !wakeLock.isHeld())) {
                                              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "WikiMV:TrackRecordingLock");
                                              wakeLock.acquire(12 * 60 * 60 * 1000L); // До 12 часов
                                          }
                                      } else {
                                          stopService(serviceIntent);
                                          if (wakeLock != null && wakeLock.isHeld()) {
                                              wakeLock.release();
                                          }
                                      }
                                  } catch (Exception ignored) {}
                              });
                          }

                          @JavascriptInterface
                          public void setKeepScreenOn(boolean keepOn) {
                              runOnUiThread(() -> {
                                  if (keepOn) {
                                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  } else {
                                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  }
                              });
                          }
                      }, "AndroidBridge");
                  }

                  requestAppPermissions();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      try {
                          ServiceWorkerController swController = ServiceWorkerController.getInstance();
                          swController.setServiceWorkerClient(new ServiceWorkerClient() {
                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {
                                  if (bridge != null && bridge.getLocalServer() != null) {
                                      return bridge.getLocalServer().shouldInterceptRequest(request);
                                  }
                                  return null;
                              }
                          });
                      } catch (Exception ignored) {}
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "window.handleGlobalBackAction ? window.handleGlobalBackAction() : false;",
                                  value -> {
                                      if (!"true".equals(value)) {
                                          setEnabled(false);
                                          getOnBackPressedDispatcher().onBackPressed();
                                          setEnabled(true);
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW);
                              intent.setData(Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      List<String> perms = new ArrayList<>();
                      if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          perms.add(android.Manifest.permission.ACCESS_FINE_LOCATION);
                          perms.add(android.Manifest.permission.ACCESS_COARSE_LOCATION);
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          if (checkSelfPermission(android.Manifest.permission.ACTIVITY_RECOGNITION) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              perms.add(android.Manifest.permission.ACTIVITY_RECOGNITION);
                          }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              perms.add(android.Manifest.permission.POST_NOTIFICATIONS);
                          }
                      }
                      if (!perms.isEmpty()) {
                          requestPermissions(perms.toArray(new String[0]), PERM_REQUEST_CODE);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # Цвета статусбара
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:fitsSystemWindows">true</item>\n        <item name="android:statusBarColor">#111827</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:navigationBarColor">#111827</item>' android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBarLaunch"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:statusBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android

      # 3. Извлекаем постоянный ключ из GitHub Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # 4. Сборка Release APK и подпись постоянным ключом
      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # Выравнивание APK (zipalign)
          $BUILD_TOOLS/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/aligned.apk

          # Подпись постоянным ключом с помощью apksigner
          $BUILD_TOOLS/apksigner sign --ks ../release.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out app/build/outputs/apk/release/wikiMV_1.0.9.apk \
            app/build/outputs/apk/release/aligned.apk

      # 5. Проверка манифеста и версии прямо в логах GitHub
      - name: Check Manifest Info
        run: |
          cd android
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/aapt dump badging app/build/outputs/apk/release/wikiMV_1.0.9.apk | grep -E "package: name|sdkVersion"

      # 6. Выгрузка готового APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikiMV_1.0.9
          path: android/app/build/outputs/apk/release/wikiMV_1.0.9.apk
