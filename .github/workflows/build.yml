name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Подготовка веб-ассетов
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js icon-*.png css js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

      - name: Setup Project and Capacitor
        run: |
          echo '{"name": "wikimapia-app", "version": "1.0.0"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          # Создаем структуру ассетов для генератора иконок
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/icon.png

          # Конфигурация Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wikimapia.viewer",
            "appName": "WikiMV",
            "webDir": "www",
            "backgroundColor": "#111827",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android

          # Генерируем все иконки (включая адаптивные под все версии Android)
          npx capacitor-assets generate --android --iconBackgroundColor "#111827"

          # --- ВОЗВРАТ СТАТУСБАРА И НАСТРОЙКА ЕГО ЦВЕТА ---
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:fitsSystemWindows">true</item>\n        <item name="android:statusBarColor">#111827</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:navigationBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          sed -i '/<style name="AppTheme.NoActionBarLaunch"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:statusBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          # --- РАЗРЕШЕНИЯ В ANDROIDMANIFEST ---
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' android/app/src/main/AndroidManifest.xml

          # --- УСТРАНЕНИЕ КОНФЛИКТА ДУБЛИРУЮЩИХСЯ КЛАССОВ KOTLIN ---
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android

          # --- 1. НАРЕЗКА ИКОНОК ИЗ icon-512.png (средствами Java 21) ---
          if [ -f "icon-512.png" ]; then
            cat << 'EOF' > ResizeIcons.java
            import javax.imageio.ImageIO;
            import java.awt.Graphics2D;
            import java.awt.RenderingHints;
            import java.awt.image.BufferedImage;
            import java.io.File;

            public class ResizeIcons {
                public static void main(String[] args) throws Exception {
                    File srcFile = new File("icon-512.png");
                    if (!srcFile.exists()) return;
                    BufferedImage src = ImageIO.read(srcFile);

                    Object[][] targets = {
                        {"mdpi", 48},
                        {"hdpi", 72},
                        {"xhdpi", 96},
                        {"xxhdpi", 144},
                        {"xxxhdpi", 192}
                    };

                    for (Object[] t : targets) {
                        String dir = (String) t[0];
                        int size = (Integer) t[1];

                        BufferedImage scaled = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB);
                        Graphics2D g = scaled.createGraphics();
                        g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
                        g.drawImage(src, 0, 0, size, size, null);
                        g.dispose();

                        File outDir = new File("android/app/src/main/res/mipmap-" + dir);
                        outDir.mkdirs();
                        ImageIO.write(scaled, "png", new File(outDir, "ic_launcher.png"));
                        ImageIO.write(scaled, "png", new File(outDir, "ic_launcher_round.png"));
                    }
                    System.out.println("Все иконки успешно сгенерированы из icon-512.png!");
                }
            }
          EOF
            java ResizeIcons.java
            rm -f ResizeIcons.java
          fi

          # --- 2. ВОЗВРАТ СТАТУСБАРА И НАСТРОЙКА ЕГО ЦВЕТА ---
          # Убираем полноэкранный режим и красим статусбар и навбар в #111827
          sed -i '/<style name="AppTheme"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:fitsSystemWindows">true</item>\n        <item name="android:statusBarColor">#111827</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:navigationBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          sed -i '/<style name="AppTheme.NoActionBarLaunch"/a \        <item name="android:windowFullscreen">false</item>\n        <item name="android:statusBarColor">#111827</item>' android/app/src/main/res/values/styles.xml

          # --- 3. РАЗРЕШЕНИЯ В ANDROIDMANIFEST ---
          # Разрешаем HTTP и аппаратное ускорение Leaflet
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

          # Разрешения геопозиции
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' android/app/src/main/AndroidManifest.xml

          # --- 4. УСТРАНЕНИЕ КОНФЛИКТА ДУБЛИРУЮЩИХСЯ КЛАССОВ KOTLIN ---
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikiMV
          path: android/app/build/outputs/apk/debug/app-debug.apk
